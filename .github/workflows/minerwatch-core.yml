name: MinerWatch core

on:
  push:
    branches: [feature/minerwatch-foundation]
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'profiles/**'
      - 'MinerWatch.slnx'
      - '.github/workflows/minerwatch-core.yml'

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build MinerWatch.slnx -c Release -m:1
      - run: dotnet run --project tests/MinerWatch.Tests -c Release --no-build -- .
      - run: dotnet run --project src/MinerWatch.Tool -c Release --no-build -- replay profiles/mining.example.json tests/fixtures/measurements/mining-session.jsonl
